[package]
name = "erdos1191"
version = "1.0.0"
edition = "2021"
authors = ["Lucas Parobek <parobek@gmail.com>"]
description = "Unconditional Diophantine Haar closure, exact harmonic-difference conservation identities, multi-octave dyadic budgets, Lean 4 formal verification, and O(1) bit-shift CPU+CUDA solver for Erdős Problem #1191 ($1,000 prize)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/doublegate/Erdos_1191"
homepage = "https://github.com/doublegate/Erdos_1191"
readme = "README.md"
keywords = ["erdos", "sidon-sets", "b2-sequences", "mian-chowla", "cuda"]
categories = ["mathematics", "algorithms", "science"]

[dependencies]
cudarc = { version = "0.19", default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "dynamic-loading",
    "cuda-13030",
] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
rayon = "1.10"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ctrlc = "3.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[package]
name = "erdos1191"
version = "0.1.0"
edition = "2021"
authors = ["Lucas Parobek <parobek@gmail.com>"]
description = "GPU-accelerated quantitative analysis of Erdős Problem #1191 ($1,000 open prize: lower-envelope fluctuations liminf A(x) sqrt(log x / x) of infinite Sidon sets): exact harmonic-difference conservation identities, dyadic difference-budget bounds, Mian–Chowla vs. Singer-block analysis, and O(1) bit-shift CUDA branch-and-bound"
license = "MIT"
repository = "https://github.com/doublegate/erdos1191"
homepage = "https://github.com/doublegate/erdos1191"
readme = "README.md"
keywords = ["erdos", "sidon-sets", "b2-sequences", "mian-chowla", "cuda"]
categories = ["mathematics", "algorithms", "science"]

[dependencies]
cudarc = { version = "0.19", default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "dynamic-loading",
    "cuda-13030",
] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
rayon = "1.10"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ctrlc = "3.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
